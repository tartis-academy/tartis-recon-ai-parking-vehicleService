# PostgreSQL dedicado de vehicle-service (database-per-service real, perfil
# prod o servicio aislado). Detalle: Obsidian Tartis-Recon-IA.
#
#   docker compose up -d

services:
  postgres:
    image: postgres:15.18-alpine
    container_name: parking-vehicle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${VEHICLE_DB_USER}
      POSTGRES_PASSWORD: ${VEHICLE_DB_PASSWORD}
      POSTGRES_DB: ${VEHICLE_DB_NAME}
    ports:
      - "${VEHICLE_DB_PORT:-5433}:5432"
    volumes:
      - parking-vehicle-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VEHICLE_DB_USER} -d ${VEHICLE_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - parking-shared

volumes:
  parking-vehicle-postgres-data:

networks:
  parking-shared:
    external: true
