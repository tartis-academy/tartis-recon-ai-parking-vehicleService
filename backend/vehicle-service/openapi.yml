openapi: 3.0.3
info:
  title: vehicle-service API
  description: >
    Manages the vehicle catalogue. Consumed by stay-service during check-in
    (via StayVehiclePort) to resolve a plate and to enforce RN-11 (a
    deactivated vehicle cannot enter).
  version: 1.1.0
  contact:
    name: TARTIS Recon-AI - Team Parking

servers:
  - url: /v1

tags:
  - name: vehicles
    description: Vehicle catalogue (CRUD + logical deactivation)

# Todas las operaciones requieren token JWT (bearerAuth) salvo el health check
# publico (/actuator/health, fuera de este contrato). SEC-13: marcado de
# securityScheme aplicado a nivel de documento.
# SEC-11: el entry point emite WWW-Authenticate y el cuerpo ErrorResponse
# producido por CustomizedExceptionAdapter.
security:
  - bearerAuth: []

paths:
  /vehicles:
    get:
      tags: [vehicles]
      operationId: listVehicles
      summary: Lists all registered vehicles
      responses:
        '200':
          description: List of vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [vehicles]
      operationId: registerVehicle
      summary: Registers a new vehicle
      description: >
        The plate is unique across the catalogue. Domain validations (plate
        format, type/numDoors coherence) live in the Vehicle domain entity, not
        in the controller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '201':
          description: Vehicle registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: A vehicle with that plate already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /vehicles/{id}:
    get:
      tags: [vehicles]
      operationId: getVehicle
      summary: Retrieves a vehicle by its ID
      parameters:
        - $ref: '#/components/parameters/VehicleIdPath'
      responses:
        '200':
          description: Vehicle detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/VehicleNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [vehicles]
      operationId: updateVehicle
      summary: Updates an existing vehicle
      description: >
        Full update of the editable data (plate, type, brand, model, colour,
        numDoors, hasSidecar). The activation state is NOT changed here, use
        PATCH /vehicles/{id}/status.
      parameters:
        - $ref: '#/components/parameters/VehicleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: Vehicle updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/VehicleNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /vehicles/plate/{plate}:
    get:
      tags: [vehicles]
      operationId: getVehicleByPlate
      summary: Retrieves a vehicle by its plate
      description: >
        Used by stay-service during check-in to check whether the vehicle already
        exists. A 404 here drives auto-registration on the stay-service side.
      parameters:
        - $ref: '#/components/parameters/PlatePath'
      responses:
        '200':
          description: Vehicle detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No vehicle registered with that plate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /vehicles/{id}/status:
    patch:
      tags: [vehicles]
      operationId: changeVehicleStatus
      summary: Activates or deactivates a vehicle (logical delete)
      description: >
        Logical delete (RN-11): a vehicle with active=false is denied entry by
        stay-service at check-in. Vehicles are never physically deleted, their
        history must survive.
      parameters:
        - $ref: '#/components/parameters/VehicleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleStatusRequest'
      responses:
        '200':
          description: State updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/VehicleNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /vehicles/{id}/activate:
    patch:
      tags: [vehicles]
      operationId: activateVehicle
      summary: Activates a vehicle
      parameters:
        - $ref: '#/components/parameters/VehicleIdPath'
      responses:
        '200':
          description: Vehicle activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/VehicleNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /vehicles/{id}/deactivate:
    patch:
      tags: [vehicles]
      operationId: deactivateVehicle
      summary: Deactivates a vehicle
      parameters:
        - $ref: '#/components/parameters/VehicleIdPath'
      responses:
        '200':
          description: Vehicle deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/VehicleNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:

    VehicleType:
      type: string
      description: Canonical enum from the domain model. Shared with stay-service.
      enum: [CAR, CAR_PMR, MOTORBIKE]

    VehicleRequest:
      type: object
      required: [type, plate, brand, model, color, numDoors]
      properties:
        type:
          $ref: '#/components/schemas/VehicleType'
        plate:
          $ref: '#/components/schemas/Plate'
        brand:
          type: string
          maxLength: 50
          example: "Toyota"
        model:
          type: string
          maxLength: 50
          example: "Corolla"
        color:
          type: string
          maxLength: 30
          example: "Rojo"
        numDoors:
          type: integer
          nullable: true
          description: >
            Number of doors. Domain rules: for CAR and CAR_PMR only 2, 4 or 5
            are accepted; for MOTORBIKE it must be null or absent. Domain
            validation, returns 400 if violated.
          example: 5
        hasSidecar:
          type: boolean
          description: Whether the vehicle has a sidecar (tricycle).

    VehicleStatusRequest:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
          example: false

    VehicleResponse:
      type: object
      properties:
        uniqueId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/VehicleType'
        plate:
          $ref: '#/components/schemas/Plate'
        brand:
          type: string
        model:
          type: string
        color:
          type: string
        numDoors:
          type: integer
          nullable: true
        hasSidecar:
          type: boolean
        active:
          type: boolean

    Plate:
      type: string
      description: >
        Spanish modern plate, 4 digits + 3 consonants (vowels, Q, N and Ñ are
        excluded). Uppercase, no separators. The domain also accepts the legacy
        format (province prefix, e.g. "M-1234-BC").
      pattern: '^[0-9]{4}[BCDFGHJKLMNPRSTVWXYZ]{3}$|^(A|AB|AL|AV|B|BA|BI|BU|C|CA|CC|CE|CO|CR|CS|CU|GC|GI|GE|GR|GU|H|HU|J|L|LE|LO|LU|M|MA|ML|MU|NA|O|OR|P|PM|PO|S|SA|SE|SG|SO|SS|T|TE|TF|TO|V|VA|VI|Z|ZA)-[0-9]{4,6}-[BCDFGHJKLMNPRSTVWXYZ]{2}$'
      minLength: 7
      maxLength: 12
      example: "1234BCD"

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 409
        error:
          type: string
          example: "CONFLICT"
        message:
          type: string
          example: "A vehicle with plate 1234BCD already exists"
        path:
          type: string
          example: "/v1/vehicles"

  parameters:
    VehicleIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PlatePath:
      name: plate
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Plate'

  responses:
    BadRequest:
      description: Invalid request (field or domain validation)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Token ausente, inválido o caducado. Devuelve ErrorResponse con header WWW-Authenticate (RFC 6750).
      headers:
        WWW-Authenticate:
          description: >
            Esquema bearer para que el cliente detecte el 401 como error OAuth2,
            según RFC 6750 §3.
          schema:
            type: string
            example: 'Bearer'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: El token es válido pero el rol no autoriza la operación. Devuelve ErrorResponse.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    VehicleNotFound:
      description: Vehicle not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
