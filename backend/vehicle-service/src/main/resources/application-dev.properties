# Perfil DEV: Postgres compartido por los 5 servicios, un schema por servicio.
# Detalle: Obsidian Tartis-Recon-IA.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:parking_dev}
spring.datasource.username=${DB_USER:parking_dev}
spring.datasource.password=${DB_PASSWORD:change.me}
spring.jpa.properties.hibernate.default_schema=vehicle

spring.jpa.hibernate.ddl-auto=update

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/parking

# Flyway apunta al schema por defecto de la conexion (public), no al schema
# "vehicle" de este servicio en el Postgres compartido de dev: sin esto
# crearia tablas huerfanas en public. Fuera de alcance de RECON-812 (que solo
# cubre las Postgres dedicadas de demo/prod); ddl-auto=update sigue
# gestionando el esquema aqui, igual que antes.
spring.flyway.enabled=false
