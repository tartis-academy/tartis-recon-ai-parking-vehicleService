# Configuracion SOLO para los tests.
#
# Los tests necesitan una base de datos real porque @SpringBootTest arranca el
# contexto completo, y spring-boot-docker-compose NO se activa durante los tests
# (spring.docker.compose.skip.in-tests viene a true por defecto).
#
# En local: levanta el entorno antes de testear -> ./setup.sh
# En CI:    el workflow arranca un Postgres como service container.
#
# Las variables permiten al CI sobrescribir sin tocar este fichero.
spring.datasource.url=jdbc:postgresql://${VEHICLE_DB_HOST:localhost}:${VEHICLE_DB_PORT:5433}/${VEHICLE_DB_NAME:vehicle_db}
spring.datasource.username=${VEHICLE_DB_USER:vehicle_user}
spring.datasource.password=${VEHICLE_DB_PASSWORD:change.me}

# Cada ejecucion parte de un esquema limpio y no deja rastro.
spring.jpa.hibernate.ddl-auto=create-drop

# SEC-04: este fichero tapa a src/main/resources/application.properties en el
# classpath de test (test-classes va antes que classes), asi que
# spring.profiles.default=dev nunca se aplica aqui y application-dev.properties
# no se carga. Sin esto, SecurityConfig no encuentra un bean JwtDecoder y
# CUALQUIER test que arranque el contexto completo (@SpringBootTest) o
# importe SecurityConfig (@WebMvcTest + @Import) falla al arrancar. El valor
# no necesita ser alcanzable: estos tests no llegan a decodificar ningun
# token de verdad, solo necesitan que el bean exista.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/parking

# Hibernate ya crea y destruye el esquema en cada run; Flyway no aporta nada
# aqui y solo anadiria una flyway_schema_history de mas.
spring.flyway.enabled=false

# Repetido de src/main/resources/application.properties: este fichero lo tapa
# entero, y sin esto /actuator/health da 503 en los tests porque no hay broker.
management.health.rabbit.enabled=false
